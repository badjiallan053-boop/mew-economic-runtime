name: Agent assurance baseline
on:
  push:
    paths:
      - 'agent-assurance/**'
      - '.github/workflows/agent-assurance.yml'
  pull_request:
    paths:
      - 'agent-assurance/**'
      - '.github/workflows/agent-assurance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify existing assurance kernel and API
        run: npm --prefix agent-assurance test
