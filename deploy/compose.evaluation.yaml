services:
  evaluation:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.evaluation
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    # No ports, host mounts, Docker socket, credentials or persistent state.
